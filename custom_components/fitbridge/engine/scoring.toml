# fitbridge scoring rules. Rules are config, code is mechanism.

[rules]
start = 2026-10-26
timezone = "Europe/Amsterdam"
merge_gap_min = 30
min_run_min = 10
min_gym_min = 20
min_home_min = 15
effort_hr_pct = 60   # an effort-checked workout counts when its average HR is at least this % of max HR
max_hr_fit_pct = 70  # a workout's max HR is trusted only when its average is at least this % of it

# Which workout types count. health_exporter: `match` is the exact HealthKit type, lower case. opentracks: `match` is
# a lower-case substring of the activity type, first hit wins (a run needs GPS points). kind: run | walk | home.
# min_min defaults to the kind's rules.min_<kind>_min; effort: true applies the effort check. Other types are stored
# but do not count.
[types]
health_exporter = [
  { match = "running", kind = "run", name = "Run" },
  { match = "walking", kind = "walk", name = "Walk" },
  { match = "hiking", kind = "walk", name = "Hike" },
  { match = "traditionalstrengthtraining", kind = "home", name = "Strength training" },
  { match = "functionalstrengthtraining", kind = "home", name = "Functional strength" },
  { match = "highintensityintervaltraining", kind = "home", name = "HIIT" },
  { match = "coretraining", kind = "home", name = "Core training" },
  { match = "mixedcardio", kind = "home", name = "Mixed cardio" },
  { match = "yoga", kind = "home", name = "Yoga" },
  { match = "pilates", kind = "home", name = "Pilates" },
  { match = "dance", kind = "home", name = "Dance" },
  { match = "cardiodance", kind = "home", name = "Cardio dance" },
  { match = "socialdance", kind = "home", name = "Social dance" },
  { match = "flexibility", kind = "home", name = "Flexibility" },
  { match = "cycling", kind = "home", name = "Cycling", min_min = 20, effort = true },
  { match = "swimming", kind = "home", name = "Swimming", min_min = 20, effort = true },
  { match = "rowing", kind = "home", name = "Rowing", min_min = 20, effort = true },
  { match = "elliptical", kind = "home", name = "Elliptical", min_min = 20, effort = true },
  { match = "stairclimbing", kind = "home", name = "Stair climbing", min_min = 20, effort = true },
  { match = "stairs", kind = "home", name = "Stairs", min_min = 20, effort = true },
  { match = "steptraining", kind = "home", name = "Step training", min_min = 20, effort = true },
]
opentracks = [
  { match = "run", kind = "run", name = "Run" },
  { match = "hardlop", kind = "run", name = "Run" },
  { match = "walk", kind = "walk", name = "Walk" },
  { match = "wandel", kind = "walk", name = "Walk" },
  { match = "bik", kind = "home", name = "Cycling", min_min = 20, effort = true },
  { match = "cycl", kind = "home", name = "Cycling", min_min = 20, effort = true },
  { match = "fiets", kind = "home", name = "Cycling", min_min = 20, effort = true },
]

[goal]
runs = 2
workouts = 2
active_days = 0
steps = 10000

[xp]
per_min = { run = 1, walk = 1, gym = 1, home = 1 }
session_cap_min = 180
day_cap_min = 240
joint_factor = 1.5
plan_session = 20
pr_session = 25
bonus = 30
active_day = 15
level_base = 50

[joint]
start_window_min = 10
overlap = 0.7

[pause]
min_days = 4

[plan]
max_sessions_per_day = 1

# People, the group, the start date and the time zone come from the integration's settings
# (Settings -> Devices & services -> ChallengeHouse -> Configure); [rules] start and timezone here are overridden.

# NHS Couch to 5K. Each session starts with a 5-minute warm-up walk. `times` repeats the
# interval list; `repeat = 3` on a week stands for 3 identical sessions.
[plans.c25k]
name = "Couch to 5K"

[[plans.c25k.weeks]]
repeat = 3
sessions = [{ warmup_s = 300, intervals = [["run", 60], ["walk", 90]], times = 8, target = { type = "duration", fraction = 0.8 } }]

[[plans.c25k.weeks]]
repeat = 3
sessions = [{ warmup_s = 300, intervals = [["run", 90], ["walk", 120]], times = 6, target = { type = "duration", fraction = 0.8 } }]

[[plans.c25k.weeks]]
repeat = 3
sessions = [{ warmup_s = 300, intervals = [["run", 90], ["walk", 90], ["run", 180], ["walk", 180]], times = 2, target = { type = "duration", fraction = 0.8 } }]

[[plans.c25k.weeks]]
repeat = 3
sessions = [{ warmup_s = 300, intervals = [["run", 180], ["walk", 90], ["run", 300], ["walk", 150], ["run", 180], ["walk", 90], ["run", 300]], target = { type = "duration", fraction = 0.8 } }]

[[plans.c25k.weeks]]
sessions = [
  { warmup_s = 300, intervals = [["run", 300], ["walk", 180]], times = 3, target = { type = "duration", fraction = 0.8 } },
  { warmup_s = 300, intervals = [["run", 480], ["walk", 300], ["run", 480]], target = { type = "duration", fraction = 0.8 } },
  { warmup_s = 300, intervals = [["run", 1200]], target = { type = "duration", fraction = 0.8 } },
]

[[plans.c25k.weeks]]
sessions = [
  { warmup_s = 300, intervals = [["run", 300], ["walk", 180], ["run", 480], ["walk", 180], ["run", 300]], target = { type = "duration", fraction = 0.8 } },
  { warmup_s = 300, intervals = [["run", 600], ["walk", 180], ["run", 600]], target = { type = "duration", fraction = 0.8 } },
  { warmup_s = 300, intervals = [["run", 1500]], target = { type = "duration", fraction = 0.8 } },
]

[[plans.c25k.weeks]]
repeat = 3
sessions = [{ warmup_s = 300, intervals = [["run", 1500]], target = { type = "duration", fraction = 0.8 } }]

[[plans.c25k.weeks]]
repeat = 3
sessions = [{ warmup_s = 300, intervals = [["run", 1680]], target = { type = "duration", fraction = 0.8 } }]

[[plans.c25k.weeks]]
repeat = 3
sessions = [{ warmup_s = 300, intervals = [["run", 1800]], target = { type = "duration", fraction = 0.8 } }]

