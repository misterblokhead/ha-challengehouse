# openGym (https://github.com/duartesantos8/opengym), pinned to the version ChallengeHouse is tested with.
# openGym must be served over HTTPS (passkeys require it): put a reverse proxy in front of the web port below
# and use its address in .env. Never change that address later, or every passkey stops working.
name: opengym
services:
  api:
    image: ghcr.io/duartesantos8/opengym-api:1.4.3
    restart: unless-stopped
    env_file: .env
    environment:
      - PORT=3000
      - DATA_DIR=/data
      - TRUST_PROXY=1
    volumes:
      - ./data:/data
  web:
    image: ghcr.io/duartesantos8/opengym-web:1.4.3
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    ports:
      # Local only: the reverse proxy forwards your HTTPS address to this port.
      - "127.0.0.1:8092:80"
    environment:
      - NGINX_PORT=80
      - BACKEND=api
      - PORT=3000
      - RESOLVER=127.0.0.11
      - CF_CONNECTING_IP=
      - BASE_PATH=
      - MEDIA_UPLOAD_MAX=48m
