name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Create the release from the CHANGELOG
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          manifest=$(jq -r .version custom_components/fitbridge/manifest.json)
          if [ "$manifest" != "$version" ]; then
            echo "::error::tag $TAG does not match manifest.json version $manifest"; exit 1
          fi
          # the section from "## [X.Y.Z](...)" up to the next "## " heading, headings excluded
          awk -v h="## [$version](" 'index($0, h) == 1 {on = 1; next} on && /^## / {exit} on' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::CHANGELOG.md has no '## [$version](...)' section"; exit 1
          fi
          gh release create "$TAG" --title "$TAG" --notes-file notes.md --verify-tag
