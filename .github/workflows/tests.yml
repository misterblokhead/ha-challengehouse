name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # the latest pytest-homeassistant-custom-component (and the Home Assistant it pins) needs 3.14
          python-version: "3.14"
          cache: pip
          cache-dependency-path: tests/requirements.txt
      - run: pip install -r tests/requirements.txt
      # the frontend component needs its package, at the version this Home Assistant pins
      - run: pip install "$(python -c "import homeassistant, json, pathlib; print(json.loads((pathlib.Path(homeassistant.__file__).parent / 'components/frontend/manifest.json').read_text())['requirements'][0])")"
      - run: python -m pytest tests -q
